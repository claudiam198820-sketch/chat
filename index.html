<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat de amigos</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f8f6f">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f3f1ec;--panel:#fff;--ink:#1c2b27;--mute:#6b7a75;--line:#e2e0da;--accent:#0f8f6f;--mine:#d6f3e6;--theirs:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#10191a;--panel:#18262a;--ink:#e6efeb;--mute:#8da39c;--line:#27393d;--accent:#2fbf95;--mine:#1d5445;--theirs:#22343a}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
.av{width:52px;height:52px;font-size:20px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:600;background-size:cover;background-position:center}
.btn{background:var(--accent);color:#fff;padding:9px 16px;border-radius:8px;font-weight:600}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
input[type=text],input[type=email],input[type=password],textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
label{display:block;margin:12px 0 4px;color:var(--mute);font-size:13px}
.err{color:#c0392b;min-height:20px;margin:8px 0 0;font-size:13px}
#auth{height:100%;display:grid;place-items:center;padding:16px}
.card{background:var(--panel);padding:28px;border-radius:14px;width:100%;max-width:360px;border:1px solid var(--line)}
.card h1{margin:0 0 4px;font-size:22px}
.card p{margin:0 0 8px;color:var(--mute)}
.row{display:flex;gap:8px;margin-top:14px}.row .btn{flex:1}
#app{height:100%;display:grid;grid-template-columns:340px 1fr}
#side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.me{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--line)}
.me .grow{flex:1;min-width:0}.me b,.fr b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me small,.fr small{color:var(--mute)}
.ico{padding:8px;border-radius:8px;color:var(--mute)}.ico:hover{background:var(--bg)}
#list{flex:1;overflow:auto}
.fr{display:flex;align-items:center;gap:10px;padding:10px 12px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.fr:hover,.fr.on{background:var(--bg)}
.fr .grow{flex:1;min-width:0}
.badge{background:var(--accent);color:#fff;border-radius:99px;padding:1px 8px;font-size:12px}
.empty{padding:24px;color:var(--mute);text-align:center}
#chat{display:flex;flex-direction:column;min-height:0;min-width:0}
#chead{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
#back{display:none}
#msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:6px}
.m{max-width:min(75%,520px);padding:7px 10px;border-radius:10px;background:var(--theirs);align-self:flex-start;overflow-wrap:anywhere;border:1px solid var(--line)}
.m.mine{background:var(--mine);align-self:flex-end;border-color:transparent}
.m time{display:block;text-align:right;font-size:11px;color:var(--mute);margin-top:2px}
.m img{max-width:100%;max-height:260px;border-radius:6px;display:block;margin-bottom:4px}
.m audio{max-width:100%;height:38px}
.m a{color:var(--accent);font-weight:600}
#bar{display:flex;align-items:flex-end;gap:6px;padding:10px;background:var(--panel);border-top:1px solid var(--line)}
#txt{resize:none;max-height:120px;flex:1}
.rec{color:#c0392b!important;background:#fdecea}
.none{flex:1;display:grid;place-items:center;color:var(--mute);text-align:center;padding:24px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:22px;width:min(380px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 6px;font-size:18px}
.pav{display:flex;align-items:center;gap:12px}
input[type=color]{width:100%;height:38px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.m{position:relative}
.m .x{position:absolute;top:2px;right:4px;font-size:11px;color:var(--mute);opacity:0;padding:2px 5px}
.m:hover .x,.m .x:focus-visible{opacity:1}
.m.sel .x{opacity:1}
.top{display:flex;gap:8px;align-items:baseline}.top b{flex:1;min-width:0}
.when{font-size:11px;color:var(--mute);flex:none}
.fr small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.typ{color:var(--accent)!important}
.m .x.rp{right:24px}.m:not(.mine) .x.rp{right:4px}
.q{border-left:3px solid var(--accent);background:rgba(0,0,0,.06);padding:2px 6px;margin-bottom:4px;border-radius:4px;font-size:12px;color:var(--mute);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
#rbar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--panel);border-top:1px solid var(--line);color:var(--mute);font-size:13px}
#rtxt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--accent);padding-left:8px}
.aud{display:flex;align-items:center}
.spd{font-size:11px;font-weight:600;color:var(--accent);padding:2px 8px;border:1px solid var(--accent);border-radius:99px;margin-left:6px}
#dImg{padding:0;background:transparent;border:0;max-width:96vw;max-height:96vh}
#dImg::backdrop{background:rgba(0,0,0,.85)}
#bigimg{display:block;max-width:96vw;max-height:92vh;border-radius:8px}
#hav,#meav,#pav,.m img{cursor:zoom-in}
.more{align-self:center;flex:none}
.tk{opacity:.6}.tk.r{color:#2f8fe0;opacity:1}
.st{align-self:flex-end;font-size:11px;color:var(--mute);margin:-2px 4px 0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2fbf95;margin-left:6px}
#chead b,#chead small{display:block}
#ccv{width:100%;max-width:300px;aspect-ratio:1;display:block;margin:12px auto 0;touch-action:none;cursor:grab;border-radius:8px;background:#000}
#czoom{width:100%}
@media(max-width:700px){
 #app{grid-template-columns:1fr}
 #chat{display:none}
 body.open #side{display:none}body.open #chat{display:flex}
 #back{display:block}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section id="auth" class="hidden">
 <div class="card">
  <h1>Chat de amigos</h1>
  <p>Mensajes, archivos y audios con tus amigos.</p>
  <label for="em">Correo</label><input id="em" type="email" autocomplete="email">
  <label for="pw">Contraseña (mínimo 6 caracteres)</label><input id="pw" type="password" autocomplete="current-password">
  <div class="err" id="aerr"></div>
  <div class="row"><button class="btn" id="login">Entrar</button><button class="btn ghost" id="signup">Crear cuenta</button></div>
  <button class="btn ghost inst hidden" style="width:100%;margin-top:10px">📲 Instalar app</button>
 </div>
</section>

<section id="app" class="hidden">
 <aside id="side">
  <div class="me">
   <div class="av" id="meav"></div>
   <div class="grow"><b id="mename"></b><small id="mecode"></small></div>
   <button class="ico inst hidden" title="Instalar app" aria-label="Instalar app">📲</button>
   <button class="ico" id="addbtn" title="Agregar amigo" aria-label="Agregar amigo">＋</button>
   <button class="ico" id="profbtn" title="Mi perfil" aria-label="Mi perfil">⚙</button>
  </div>
  <div id="list"></div>
 </aside>
 <main id="chat">
  <div class="none" id="none">Elige un amigo para empezar a chatear.</div>
  <div id="cwrap" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0">
   <div id="chead"><button class="ico" id="back" aria-label="Volver">←</button><div class="av" id="hav"></div><div><b id="hname"></b><small id="hbio" style="color:var(--mute)"></small></div></div>
   <div id="msgs" role="log" aria-live="polite"></div>
   <div id="rbar" class="hidden"><span id="rtxt"></span><button class="ico" id="rx" aria-label="Cancelar respuesta">✕</button></div>
   <div id="bar">
    <button class="ico" id="attach" title="Adjuntar archivo" aria-label="Adjuntar archivo">📎</button>
    <input type="file" id="file" class="hidden">
    <textarea id="txt" rows="1" placeholder="Escribe un mensaje"></textarea>
    <button class="ico" id="mic" title="Grabar audio" aria-label="Grabar audio">🎤</button>
    <button class="btn" id="send">Enviar</button>
   </div>
  </div>
 </main>
</section>

<dialog id="dAdd">
 <h2>Agregar amigo</h2>
 <p style="color:var(--mute);margin:0">Escribe el código de tu amigo.</p>
 <label for="fcode">Código de amigo</label><input id="fcode" type="text" autocapitalize="characters">
 <div class="err" id="aderr"></div>
 <div class="row"><button class="btn ghost" data-close>Cancelar</button><button class="btn" id="doadd">Agregar</button></div>
</dialog>

<dialog id="dProf">
 <h2>Mi perfil</h2>
 <div class="pav"><div class="av" id="pav" style="width:120px;height:120px;font-size:44px"></div><button class="btn ghost" id="pick">Cambiar foto</button><input type="file" id="pfile" accept="image/*" class="hidden"></div>
 <label for="pname">Nombre</label><input id="pname" type="text" maxlength="40">
 <label for="pbio">Estado</label><input id="pbio" type="text" maxlength="80">
 <label for="pcolor">Color del perfil</label><input id="pcolor" type="color">
 <label for="pcode">Mi código de amigo (3 a 20 letras, números o _)</label><input id="pcode" type="text" maxlength="20" autocapitalize="characters">
 <div class="err" id="perr"></div>
 <div class="row"><button class="btn ghost" data-close>Cerrar</button><button class="btn" id="psave">Guardar cambios</button></div>
 <div class="row"><button class="btn ghost" id="logout">Cerrar sesión</button></div>
</dialog>

<dialog id="dImg"><img id="bigimg" alt=""></dialog>

<dialog id="dCrop">
 <h2>Ajusta tu foto</h2>
 <p style="color:var(--mute);margin:0">Arrastra para mover y usa el zoom para encuadrar.</p>
 <canvas id="ccv" width="300" height="300"></canvas>
 <label for="czoom">Zoom</label><input id="czoom" type="range" min="1" max="4" step="0.01" value="1">
 <div class="err" id="cerr"></div>
 <div class="row"><button class="btn ghost" id="ccancel">Cancelar</button><button class="btn" id="csave">Usar foto</button></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// 1) Pega aquí los datos de tu proyecto Supabase (Settings > API)
const SUPABASE_URL = 'https://bpcxbbjdpjgcimbtfpos.supabase.co';
const SUPABASE_KEY = 'sb_publishable_E_IxjCgD7aGA50kRvBZXLw_kFBW-TnT';

if (SUPABASE_URL.startsWith('PEGA_AQUI') || SUPABASE_KEY.startsWith('PEGA_AQUI')) {
  document.body.innerHTML = '<div class="none" style="height:100%">Falta configurar Supabase: abre index.html y pega tu Project URL y tu anon key en las dos primeras líneas del script.</div>';
  throw new Error('Supabase sin configurar');
}
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const MAX_MB = 20, PAGE = 50;
let me, friends = [], cur = null, msgs = [], unread = {}, seen = new Set(), rec = null, chan = null, online = new Set(), last = {}, typing = {}, replyTo = null, pres = null, lastTyp = 0;
const nodes = new Map(), urlCache = new Map();
const more = Object.assign(document.createElement('button'), { className: 'btn ghost more hidden', textContent: 'Cargar mensajes anteriores' });

function el(tag, cls, text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function avatar(node, p){
  node.style.backgroundColor = p.color || '#0f8f6f'; node.style.backgroundSize = 'cover'; node.style.backgroundPosition = 'center'; node.textContent = '';
  // Solo se aceptan imágenes alojadas en tu propio Supabase
  if (p.avatar && p.avatar.startsWith(SUPABASE_URL + '/')) node.style.backgroundImage = 'url(' + JSON.stringify(p.avatar) + ')';
  else { node.style.backgroundImage = 'none'; node.textContent = (p.name || '?').trim().charAt(0).toUpperCase(); }
}
function hm(d){return new Date(d).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}
// ✓ enviado · ✓✓ entregado · ✓✓ azul visto
function paintTime(t, m){
  t.textContent = hm(m.created_at); t.title = '';
  if (m.sender!==me.id) return;
  t.append(el('span','tk' + (m.read_at ? ' r' : ''), (m.delivered_at || m.read_at) ? ' ✓✓' : ' ✓'));
  t.title = `Enviado ${hm(m.created_at)}` + (m.delivered_at ? ` · Entregado ${hm(m.delivered_at)}` : '') + (m.read_at ? ` · Visto ${hm(m.read_at)}` : '');
}
const stEl = el('div','st');
function refreshSt(){ // estado bajo tu último mensaje
  const last = msgs[msgs.length-1];
  if (!last || last.sender!==me.id) return stEl.remove();
  stEl.textContent = last.read_at ? 'Visto ' + hm(last.read_at) : last.delivered_at ? 'Entregado' : 'Enviado';
  $('msgs').append(stEl);
}
function lastSeenTxt(ts){
  if (!ts) return '';
  const d = new Date(ts), n = new Date(), y = new Date(n - 864e5), same = (a,b) => a.toDateString()===b.toDateString();
  return 'últ. vez ' + (same(d,n) ? 'hoy' : same(d,y) ? 'ayer' : d.toLocaleDateString([], {day:'numeric',month:'short'})) + ' a las ' + hm(ts);
}
async function paintHead(refetch){
  const f = cur; if (!f) return;
  if (refetch && !online.has(f.id)) {
    const { data } = await sb.from('profiles').select('last_seen').eq('id', f.id).single();
    if (data) f.last_seen = data.last_seen;
    if (cur !== f) return;
  }
  const st = typing[f.id] ? 'escribiendo…' : online.has(f.id) ? 'en línea' : lastSeenTxt(f.last_seen);
  $('hbio').textContent = st + (f.bio ? (st ? ' · ' : '') + f.bio : '');
}
// URLs firmadas (caducan en 1 h) para los archivos privados del chat
function signed(path){
  const c = urlCache.get(path); if (c && c.exp > Date.now()) return c.p;
  const p = sb.storage.from('chat').createSignedUrl(path, 3600).then(r => r.data?.signedUrl || null);
  urlCache.set(path, { p, exp: Date.now() + 3300e3 }); return p;
}

/* ---------- Sesión ---------- */
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  session ? start() : showAuth();
  sb.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT') location.reload(); });
}
function showAuth(){ $('auth').classList.remove('hidden'); $('app').classList.add('hidden'); }
async function doAuth(signup){
  $('aerr').textContent = '';
  const email = $('em').value.trim(), password = $('pw').value;
  const { data, error } = signup ? await sb.auth.signUp({email,password}) : await sb.auth.signInWithPassword({email,password});
  if (error) return $('aerr').textContent = error.message;
  if (!data.session) return $('aerr').textContent = 'Revisa tu correo para confirmar la cuenta.';
  start();
}
$('login').onclick = () => doAuth(false);
$('signup').onclick = () => doAuth(true);
$('logout').onclick = () => sb.auth.signOut();

async function start(){
  try {
    const { data:{ user } } = await sb.auth.getUser();
    if (!user) return showAuth();
    const { data: p, error } = await sb.from('profiles').select('*').eq('id', user.id).single();
    if (error) throw error;
    me = p;
  } catch (e) { showAuth(); return $('aerr').textContent = 'No se pudo cargar tu perfil: ' + (e.message || 'revisa tu conexión y que ejecutaste setup.sql'); }
  $('auth').classList.add('hidden'); $('app').classList.remove('hidden');
  paintMe(); await loadFriends(); await loadUnread(); await loadLast(); markDelivered();
  let first = true;
  chan = sb.channel('msgs')
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'messages', filter:`receiver=eq.${me.id}`}, onNew)
    .on('postgres_changes', {event:'UPDATE', schema:'public', table:'messages', filter:`sender=eq.${me.id}`}, onUpd)
    .on('postgres_changes', {event:'DELETE', schema:'public', table:'messages'}, onDel)
    .subscribe(s => { if (s==='SUBSCRIBED') { if (first) first = false; else sync(); } });
  pres = sb.channel('online', { config:{ presence:{ key: me.id } } });
  pres.on('presence', { event:'sync' }, () => { online = new Set(Object.keys(pres.presenceState())); renderList(); paintHead(true); })
      .on('broadcast', { event:'typing' }, onTyping)
      .subscribe(s => { if (s==='SUBSCRIBED' && !document.hidden) pres.track({ at: Date.now() }); });
  const seenNow = async () => { await sb.from('profiles').update({ last_seen: new Date().toISOString() }).eq('id', me.id); };
  seenNow(); setInterval(() => { if (!document.hidden) seenNow(); }, 60000);
  document.addEventListener('visibilitychange', () => {
    seenNow();
    if (document.hidden) pres.untrack(); else { pres.track({ at: Date.now() }); sync(); }
  });
}
// Se ejecuta al reconectar o volver a la pestaña: recupera lo que llegó mientras no estabas
async function sync(){ if (!me) return; await loadFriends(); await loadUnread(); await loadLast(); markDelivered(); if (cur) await openChat(cur); }
function paintMe(){ avatar($('meav'), me); $('mename').textContent = me.name; $('mecode').textContent = 'Código: ' + me.code; }

/* ---------- Amigos ---------- */
async function loadFriends(){
  const { data: rel } = await sb.from('friends').select('friend_id').eq('user_id', me.id);
  const ids = (rel || []).map(r => r.friend_id);
  friends = ids.length ? (await sb.from('profiles').select('*').in('id', ids)).data || [] : [];
  renderList();
}
async function loadUnread(){
  const { data } = await sb.from('messages').select('sender').eq('receiver', me.id).is('read_at', null).limit(1000);
  unread = {}; (data || []).forEach(r => unread[r.sender] = (unread[r.sender] || 0) + 1);
  if (cur) unread[cur.id] = 0;
  renderList();
}
async function loadLast(){
  const { data } = await sb.from('messages').select('*').or(`sender.eq.${me.id},receiver.eq.${me.id}`).order('created_at', { ascending:false }).limit(300);
  last = {}; (data || []).forEach(m => { const o = m.sender===me.id ? m.receiver : m.sender; if (!last[o]) last[o] = m; });
  renderList();
}
const pv = m => (m.sender===me.id ? 'Tú: ' : '') + (m.kind==='text' ? m.body : m.kind==='audio' ? '🎤 Audio' : '📄 ' + (m.fname || 'Archivo'));
function when(ts){
  const d = new Date(ts), n = new Date();
  if (d.toDateString()===n.toDateString()) return hm(ts);
  if (d.toDateString()===new Date(n - 864e5).toDateString()) return 'ayer';
  return d.toLocaleDateString([], { day:'numeric', month:'short' });
}
function renderList(){
  const box = $('list'); box.textContent = '';
  const n = Object.values(unread).reduce((a, b) => a + b, 0); document.title = (n ? `(${n}) ` : '') + 'Chat de amigos';
  if (!friends.length) return box.append(el('div','empty','Aún no tienes amigos. Toca ＋ y escribe el código de un amigo.'));
  const t = f => last[f.id] ? +new Date(last[f.id].created_at) : 0;
  [...friends].sort((a, b) => t(b) - t(a) || a.name.localeCompare(b.name)).forEach(f => {
    const b = el('button','fr' + (cur && cur.id===f.id ? ' on':'')), a = el('div','av'); avatar(a,f);
    const g = el('div','grow'), top = el('div','top'), nm = el('b',null,f.name), l = last[f.id];
    if (online.has(f.id)) nm.append(el('span','dot'));
    top.append(nm); if (l) top.append(el('span','when',when(l.created_at)));
    g.append(top, el('small', typing[f.id] ? 'typ' : null, typing[f.id] ? 'escribiendo…' : l ? pv(l) : (f.bio || ' ')));
    b.append(a,g); if (unread[f.id]) b.append(el('span','badge',unread[f.id]));
    b.onclick = () => openChat(f); box.append(b);
  });
}
$('addbtn').onclick = () => { $('fcode').value=''; $('aderr').textContent=''; $('dAdd').showModal(); };
$('doadd').onclick = async () => {
  const { error } = await sb.rpc('add_friend', { c: $('fcode').value });
  if (error) return $('aderr').textContent = error.message;
  $('dAdd').close(); loadFriends();
};
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('dialog').close());

/* ---------- Chat ---------- */
const q = f => sb.from('messages').select('*')
  .or(`and(sender.eq.${me.id},receiver.eq.${f.id}),and(sender.eq.${f.id},receiver.eq.${me.id})`);

async function openChat(f){
  if (cur !== f) clearReply(); cur = f; unread[f.id] = 0; document.body.classList.add('open');
  $('none').classList.add('hidden'); $('cwrap').classList.remove('hidden');
  avatar($('hav'), f); $('hname').textContent = f.name; paintHead(true);
  const { data } = await q(f).order('created_at', { ascending:false }).limit(PAGE); // los más recientes
  if (cur !== f) return; // cambiaste de chat mientras cargaba
  const page = data || [];
  msgs = page.slice().reverse(); seen = new Set(msgs.map(m => m.id));
  const box = $('msgs'); box.textContent = ''; nodes.clear(); box.append(more);
  more.classList.toggle('hidden', page.length < PAGE);
  msgs.forEach(m => draw(m)); refreshSt(); scrollEnd(); renderList(); markRead(f.id);
}
more.onclick = async () => {
  if (!cur || !msgs.length) return;
  const f = cur;
  const { data } = await q(f).lt('created_at', msgs[0].created_at).order('created_at', { ascending:false }).limit(PAGE);
  if (cur !== f) return;
  const older = (data || []).reverse(), ref = more.nextSibling, box = $('msgs'), h = box.scrollHeight;
  older.forEach(m => { seen.add(m.id); draw(m, ref); }); msgs = older.concat(msgs);
  more.classList.toggle('hidden', (data || []).length < PAGE);
  box.scrollTop += box.scrollHeight - h; // mantiene la posición de lectura
};
async function markRead(id){
  await sb.from('messages').update({ read_at: new Date().toISOString() }).eq('receiver', me.id).eq('sender', id).is('read_at', null);
}
async function markDelivered(){
  await sb.from('messages').update({ delivered_at: new Date().toISOString() }).eq('receiver', me.id).is('delivered_at', null);
}
$('back').onclick = () => { document.body.classList.remove('open'); cur = null; renderList(); };
function scrollEnd(){ const m=$('msgs'); m.scrollTop = m.scrollHeight; }
function draw(m, before){
  const mine = m.sender === me.id;
  const d = el('div','m' + (mine ? ' mine':'')); d.dataset.id = m.id;
  if (m.reply_to) { const o = msgs.find(x => x.id===m.reply_to), qd = el('div','q', o ? pv(o) : '↩ Mensaje anterior'); qd.onclick = () => nodes.get(m.reply_to)?.scrollIntoView({ block:'center' }); d.append(qd); }
  if (m.kind==='text') d.append(document.createTextNode(m.body));
  else if (m.kind==='audio'){ const a=el('audio'), w=el('div','aud'), sp=el('button','spd','1x'); a.controls=true;
    sp.onclick = () => { const r = a.playbackRate===1 ? 1.5 : a.playbackRate===1.5 ? 2 : 1; a.playbackRate = r; sp.textContent = r + 'x'; };
    w.append(a, sp); d.append(w); signed(m.path).then(u => { if (u) a.src = u; }); }
  else {
    const a = el('a',null,'📄 ' + (m.fname||'archivo')); a.target='_blank'; a.rel='noopener'; d.append(a);
    signed(m.path).then(u => { if (u) { a.href = u; a.download = m.fname || ''; } });
    if (/\.(png|jpe?g|gif|webp)$/i.test(m.fname||'')) { const i=el('img'); i.alt=m.fname; i.onclick = () => showPhoto(i.src); d.prepend(i); signed(m.path).then(u => { if (u) i.src = u; }); }
  }
  const t = el('time'); paintTime(t, m); d.append(t);
  const rp = el('button','x rp','↩'); rp.title = 'Responder'; rp.setAttribute('aria-label','Responder'); rp.onclick = () => setReply(m); d.append(rp);
  d.onclick = e => { if (!e.target.closest('button,a,img,audio,.q')) d.classList.toggle('sel'); };
  if (mine) { const x = el('button','x','✕'); x.title = 'Eliminar'; x.setAttribute('aria-label','Eliminar mensaje'); x.onclick = () => delMsg(m.id); d.append(x); }
  nodes.set(m.id, d);
  before ? $('msgs').insertBefore(d, before) : $('msgs').append(d);
}
function add(m){ if (seen.has(m.id)) return; seen.add(m.id); msgs.push(m); last[cur.id] = m; draw(m); refreshSt(); scrollEnd(); renderList(); }
async function delMsg(id){
  if (!confirm('¿Eliminar este mensaje?')) return;
  const m = msgs.find(x => x.id===id);
  const { error } = await sb.from('messages').delete().eq('id', id);
  if (error) return alert('No se pudo eliminar: ' + error.message);
  if (m?.path) sb.storage.from('chat').remove([m.path]);
  onDel({ old:{ id } });
}
function onDel({ old:o }){
  const d = nodes.get(o.id); if (!d) return;
  d.remove(); nodes.delete(o.id); seen.delete(o.id); msgs = msgs.filter(x => x.id!==o.id); refreshSt(); loadLast();
}
function onUpd({ new:m }){ // el otro leyó tu mensaje
  const d = nodes.get(m.id); if (!d) return;
  const i = msgs.findIndex(x => x.id===m.id); if (i >= 0) msgs[i] = m;
  paintTime(d.querySelector('time'), m); refreshSt();
}
async function onNew({ new:m }){
  delete typing[m.sender];
  markDelivered();
  if (!friends.some(f => f.id===m.sender)) await loadFriends();
  if (document.hidden || !cur || cur.id!==m.sender) { const f = friends.find(x => x.id===m.sender); notify(f ? f.name : 'Nuevo mensaje', pv(m), m.sender); }
  if (cur && cur.id===m.sender) { add(m); if (!document.hidden) markRead(m.sender); }
  else { unread[m.sender] = (unread[m.sender]||0) + 1; last[m.sender] = m; renderList(); }
}
async function post(row, to = cur){
  const { data, error } = await sb.from('messages').insert({ sender: me.id, receiver: to.id, ...(replyTo ? { reply_to: replyTo.id } : {}), ...row }).select().single();
  if (error) return alert('No se pudo enviar: ' + error.message);
  clearReply(); if (cur && cur.id===to.id) add(data);
}
// Los archivos van a un bucket privado; se guarda la ruta, no una URL pública
async function upload(blob, name){
  if (blob.size > MAX_MB*1024*1024) { alert(`El archivo supera ${MAX_MB} MB.`); return null; }
  const path = `${me.id}/${crypto.randomUUID()}-${name.replace(/[^\w.\-]+/g,'_')}`;
  const { error } = await sb.storage.from('chat').upload(path, blob, { contentType: blob.type || undefined });
  if (error) { alert('No se pudo subir: ' + error.message); return null; }
  return path;
}
async function sendText(){
  const t = $('txt').value.trim(); if (!t || !cur) return;
  $('txt').value = ''; await post({ kind:'text', body:t });
}
$('send').onclick = sendText;
$('txt').onkeydown = e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendText(); } };
$('attach').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0], to = cur; e.target.value=''; if (!f || !to) return;
  const path = await upload(f, f.name); if (path) post({ kind:'file', path, fname:f.name }, to);
};

/* ---------- Audio ---------- */
$('mic').onclick = async () => {
  const b = $('mic');
  if (rec) { rec.stop(); return; }
  if (!cur) return;
  const to = cur; // el audio va a quien tenías abierto al empezar
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    const mime = ['audio/webm','audio/mp4','audio/ogg'].find(t => MediaRecorder.isTypeSupported(t)) || '';
    const chunks = []; let iv; rec = new MediaRecorder(stream, mime ? { mimeType:mime } : undefined);
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = async () => {
      clearInterval(iv); stream.getTracks().forEach(t => t.stop());
      b.classList.remove('rec'); b.textContent = '🎤'; b.setAttribute('aria-label','Grabar audio'); rec = null;
      const type = chunks[0]?.type || mime || 'audio/webm';
      const blob = new Blob(chunks, { type }); const ext = type.includes('mp4') ? 'm4a' : type.includes('ogg') ? 'ogg' : 'webm';
      const path = await upload(blob, `audio.${ext}`); if (path) post({ kind:'audio', path, fname:`audio.${ext}` }, to);
    };
    rec.start(); const t0 = Date.now();
    b.classList.add('rec'); b.textContent = '⏹ 0:00'; b.setAttribute('aria-label','Detener grabación');
    iv = setInterval(() => { const s = Math.floor((Date.now()-t0)/1000); b.textContent = `⏹ ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }, 500);
  } catch { alert('Necesito permiso para usar el micrófono.'); }
};

/* ---------- Perfil ---------- */
let newAvatar = null;
// La foto se reduce a 256 px (JPEG) antes de subirla al bucket público "avatars"
async function decode(file){
  if (window.createImageBitmap) { try { return await createImageBitmap(file); } catch {} }
  return new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('prueba con JPG o PNG')); i.src = URL.createObjectURL(file); });
}
async function uploadAvatar(blob){
  try {
    const { error } = await sb.storage.from('avatars').upload(`${me.id}/avatar.jpg`, blob, { upsert:true, contentType:'image/jpeg' });
    if (error) throw error;
    return sb.storage.from('avatars').getPublicUrl(`${me.id}/avatar.jpg`).data.publicUrl + '?v=' + Date.now();
  } catch (e) {
    $('cerr').textContent = 'No se pudo subir la foto: ' + e.message + (/bucket not found/i.test(e.message) ? ' (falta correr migracion.sql en Supabase)' : '');
    return null;
  }
}
/* Editor de foto: arrastra para mover, zoom con la barra o la rueda del mouse */
const S = 300, cv = $('ccv'), cg = cv.getContext('2d');
let ci = null, cz = 1, cx = 0, cy = 0, cw = 0, ch = 0, drag = null;
const cscale = () => Math.max(S/cw, S/ch) * cz;
function cclamp(){
  const mx = Math.max(0, (cw*cscale()-S)/2), my = Math.max(0, (ch*cscale()-S)/2);
  cx = Math.min(mx, Math.max(-mx, cx)); cy = Math.min(my, Math.max(-my, cy));
}
function cdraw(){
  const k = cscale(); cg.clearRect(0, 0, S, S);
  cg.drawImage(ci, S/2+cx-cw*k/2, S/2+cy-ch*k/2, cw*k, ch*k);
  cg.fillStyle = 'rgba(0,0,0,.55)'; cg.beginPath(); cg.rect(0, 0, S, S); cg.arc(S/2, S/2, S/2, 0, Math.PI*2, true); cg.fill('evenodd');
}
cv.onpointerdown = e => { drag = { x:e.clientX, y:e.clientY, cx, cy }; cv.setPointerCapture(e.pointerId); };
cv.onpointermove = e => {
  if (!drag) return; const r = S / cv.getBoundingClientRect().width;
  cx = drag.cx + (e.clientX-drag.x)*r; cy = drag.cy + (e.clientY-drag.y)*r; cclamp(); cdraw();
};
cv.onpointerup = cv.onpointercancel = () => drag = null;
$('czoom').oninput = () => { cz = +$('czoom').value; cclamp(); cdraw(); };
cv.onwheel = e => { e.preventDefault(); $('czoom').value = Math.min(4, Math.max(1, cz - e.deltaY/500)); $('czoom').oninput(); };
$('pfile').onchange = async e => {
  const f = e.target.files[0]; e.target.value=''; if (!f) return;
  $('perr').textContent = '';
  if (!f.type.startsWith('image/')) return $('perr').textContent = 'Elige una imagen.';
  try { ci = await decode(f); } catch (err) { return $('perr').textContent = 'No se pudo abrir la foto: ' + err.message; }
  cw = ci.naturalWidth || ci.width; ch = ci.naturalHeight || ci.height; cz = 1; cx = cy = 0;
  $('czoom').value = 1; $('cerr').textContent = ''; cdraw(); $('dCrop').showModal();
};
$('ccancel').onclick = () => $('dCrop').close();
$('csave').onclick = async () => {
  const O = 512, f = O/S, k = cscale(), out = document.createElement('canvas'); out.width = out.height = O;
  out.getContext('2d').drawImage(ci, f*(S/2+cx-cw*k/2), f*(S/2+cy-ch*k/2), f*cw*k, f*ch*k);
  const blob = await new Promise(r => out.toBlob(r, 'image/jpeg', .88));
  const url = await uploadAvatar(blob); if (!url) return;
  const { data, error } = await sb.from('profiles').update({ avatar:url }).eq('id', me.id).select().single();
  if (error) return $('cerr').textContent = 'No se pudo guardar la foto: ' + error.message;
  me = data; newAvatar = null; paintMe(); avatar($('pav'), me); $('dCrop').close();
};
$('pcolor').oninput = () => avatar($('pav'), { ...me, avatar:newAvatar ?? me.avatar, color:$('pcolor').value, name:$('pname').value });
$('psave').onclick = async () => {
  const code = $('pcode').value.trim().toUpperCase();
  if (!/^[A-Z0-9_]{3,20}$/.test(code)) return $('perr').textContent = 'El código debe tener de 3 a 20 letras, números o _.';
  const upd = { name: $('pname').value.trim() || 'Usuario', bio: $('pbio').value.trim(), color: $('pcolor').value, code };
  if (newAvatar) upd.avatar = newAvatar;
  const { data, error } = await sb.from('profiles').update(upd).eq('id', me.id).select().single();
  if (error) return $('perr').textContent = error.code==='23505' ? 'Ese código ya está en uso. Prueba con otro.' : error.message;
  me = data; paintMe(); $('dProf').close();
};

function setReply(m){ replyTo = m; $('rtxt').textContent = pv(m); $('rbar').classList.remove('hidden'); $('txt').focus(); }
function clearReply(){ replyTo = null; $('rbar').classList.add('hidden'); }
$('rx').onclick = clearReply;

function onTyping({ payload:p }){
  if (p.to!==me.id) return;
  typing[p.from] = Date.now(); paintHead(); renderList();
  setTimeout(() => { if (Date.now() - typing[p.from] >= 3000) { delete typing[p.from]; paintHead(); renderList(); } }, 3100);
}
$('txt').addEventListener('input', () => {
  if (!cur || !pres || Date.now() - lastTyp < 2000) return; lastTyp = Date.now();
  pres.send({ type:'broadcast', event:'typing', payload:{ from:me.id, to:cur.id } });
});

function showPhoto(u){ if (!u) return; $('bigimg').src = u; $('dImg').showModal(); }
$('dImg').onclick = () => $('dImg').close();
$('hav').onclick = () => cur && showPhoto(cur.avatar);
$('meav').onclick = () => showPhoto(me.avatar);
$('pav').onclick = () => showPhoto(me.avatar);

// Notificaciones (funcionan con la app abierta o en segundo plano) y app instalable
async function notify(title, body, tag){
  if (!('Notification' in window) || Notification.permission!=='granted') return;
  const reg = await navigator.serviceWorker?.getRegistration();
  reg ? reg.showNotification(title, { body, tag, icon:'icon-192.png' }) : new Notification(title, { body, tag });
}
document.addEventListener('click', () => { if ('Notification' in window && Notification.permission==='default') Notification.requestPermission(); }, { once:true });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

// Botón "Instalar app": un toque en Android/PC; en iPhone muestra los pasos
let dip = null;
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const showInst = on => document.querySelectorAll('.inst').forEach(b => b.classList.toggle('hidden', !on || standalone));
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); dip = e; showInst(true); });
window.addEventListener('appinstalled', () => { dip = null; showInst(false); });
if (/iphone|ipad|ipod/i.test(navigator.userAgent)) showInst(true);
document.querySelectorAll('.inst').forEach(b => b.onclick = async () => {
  if (dip) { dip.prompt(); await dip.userChoice; dip = null; showInst(false); }
  else alert('En iPhone: toca el botón Compartir de Safari y elige "Agregar a pantalla de inicio".');
});

boot();
</script>
